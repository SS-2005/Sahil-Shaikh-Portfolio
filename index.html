<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahil Shaikh – Intro</title>

    <!-- Fonts (Fredoka) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS (includes intro styles) -->
    <link href="assets/css/main.css" rel="stylesheet">

    <!-- Typed.js for animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<div id="introScreen" style="opacity:1; visibility:visible;">
    <div class="intro-bg">
        <div class="intro-orb io1"></div>
        <div class="intro-orb io2"></div>
        <div class="intro-orb io3"></div>
    </div>
    <div class="intro-inner">
        <div class="intro-video-wrap">
            <video id="introVideo" autoplay muted playsinline loop>
                <source src="assets/img/logo.mp4" type="video/mp4" />
            </video>
        </div>
        <div class="intro-text-col">
            <span class="intro-label">Welcome to my portfolio</span>
            <div class="intro-typed-name" id="introTyped"></div>
            <span class="intro-tagline">AI/ML Engineer · Innovator · Creator</span>
            <div class="intro-bar" id="introBar"></div>
        </div>
    </div>
    <button class="intro-skip" id="introSkip">Skip →</button>
</div>

<script>
    (function() {
        // Check if intro has already been shown in this tab
        if (sessionStorage.getItem('introShown')) {
            // Already seen, redirect immediately to content
            window.location.replace('content.html');
            return;
        }

        // Show intro and set flag after it's done
        const introScreen = document.getElementById('introScreen');
        const skipBtn = document.getElementById('introSkip');
        const typedElement = document.getElementById('introTyped');
        const introBar = document.getElementById('introBar');

        // Initialize typed animation
        if (typedElement) {
            new Typed(typedElement, {
                strings: ["Developed by ^1000 Sahil Shaikh...", "Lets Connect"],
                typeSpeed: 60,
                backSpeed: 30,
                backDelay: 1500,
                startDelay: 500,
                loop: true,
                showCursor: true,
                cursorChar: '|',
                onComplete: function() {
                    introBar.style.width = '100%';
                }
            });
        }

        function goToContent() {
            sessionStorage.setItem('introShown', 'true');
            window.location.href = 'content.html';
        }

        skipBtn.addEventListener('click', goToContent);

        // Auto redirect after 8 seconds (can be adjusted)
        setTimeout(goToContent, 8000);
    })();
</script>

</body>
</html>
